# Reference baseline policy for the dashboard namespace (audit first: enableDefaultDeny false, watch Hubble, then
# enforce). Placeholders in <>. FQDN rules need the DNS L7 rule. The API reaches the AKS API server through the
# cluster's private endpoint (privateFQDN) — keep whichever of kube-apiserver / the PE /32 Hubble shows matching.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aud-dashboard-baseline
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: false, egress: false }    # audit phase; true when enforcing
  ingress:
    - fromCIDR: ["<agc-subnet-cidr>"]
      toPorts: [{ ports: [{ port: "3000", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { "k8s:io.kubernetes.pod.namespace": kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [kube-apiserver]
    - toCIDR: ["<api-server-private-endpoint-ip>/32"]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toFQDNs:
        - matchName: login.microsoftonline.com          # token exchange + user-token signing keys (sign-in fails without it)
        - matchName: management.azure.com
        - matchName: api.loganalytics.io
        - matchName: <amw-name>.<region>.prometheus.monitor.azure.com
        - matchName: azure.status.microsoft
        - matchName: rssfeed.azure.status.microsoft
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
