# Reference Deployment for an AKS cluster (customer GitOps renders its own chart from this; placeholders in <>).
# One pod, two containers of the same image: web :3000 (the only port) + api on 127.0.0.1:4000 (no Service).
# Azure is read with a user-assigned managed identity through workload identity — no secret anywhere.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <log-prefix>-aud-dashboard        # match the cluster's log-collection pod-name pattern
  labels:
    app.kubernetes.io/name: aud-dashboard
    app.kubernetes.io/instance: aud-dashboard
spec:
  replicas: 1                             # caches and live diagrams are in memory
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: aud-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aud-dashboard
        app.kubernetes.io/instance: aud-dashboard
        azure.workload.identity/use: "true"
      annotations:
        # Only the API gets the federated token (the web never calls Azure)
        azure.workload.identity/skip-containers: web
    spec:
      serviceAccountName: aud-dashboard
      automountServiceAccountToken: false  # the workload identity token is its own projected volume
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: <acr>/<in-house-path>/aud-dashboard:<exact-tag>
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: "0.0.0.0" }      # Kubernetes sets HOSTNAME to the pod name
            - { name: AUD_WEB_TENANT_ID, value: "<home-tenant-guid>" }
            - { name: AUD_WEB_CLIENT_ID, value: "<aud-web-spa-client-id>" }
            - { name: AUD_WEB_API_SCOPE, value: "api://<aud-api-app-client-id>/Azure.Read.All" }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }      # web + the API next to it; never Azure
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }                  # no CPU limit (cluster standard)
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: web-tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/web/apps/web/.next/cache }
        - name: api
          image: <acr>/<in-house-path>/aud-dashboard:<exact-tag>
          command: ["node", "/app/apps/api/dist/index.js"]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "4000" }
            - { name: API_BIND_HOST, value: "127.0.0.1" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
            - { name: AZURE_AD_TENANT_ID, value: "<home-tenant-guid>" }
            - { name: AZURE_AD_CLIENT_ID, value: "<aud-api-app-client-id>" }
            - { name: AUD_AUTH_AUDIENCES, value: "api://<aud-api-app-client-id>" }
            - { name: AZURE_SUBSCRIPTION_IDS, value: "<stg-subscription-guid>" }
            - { name: CORS_ORIGIN, value: "https://<host>" }
            - { name: AUD_PLATFORM_CREDENTIAL, value: workloadIdentity }   # AZURE_CLIENT_ID + token file from the webhook
            - { name: AUD_AUDIT_LOG, value: stdout }
            - { name: AZURE_LIVE_DIAGRAM_ENABLED, value: "true" }
            - { name: AZURE_SECURITY_ENABLED, value: "true" }
            - { name: AUD_CONNECTIONS_FILE, value: /etc/aud/connections.json }
          # kubelet probes the pod IP; the API listens on loopback only → exec probes
          startupProbe:
            exec: { command: ["node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"] }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: { command: ["node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"] }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext: *hardened
          volumeMounts:
            - { name: api-tmp, mountPath: /tmp }
            - { name: connections, mountPath: /etc/aud, readOnly: true }
      volumes:
        - { name: web-tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: api-tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: next-cache, emptyDir: { sizeLimit: 128Mi } }
        - { name: connections, configMap: { name: aud-dashboard-connections } }   # IDs and names only — no secrets
---
apiVersion: v1
kind: Service
metadata:
  name: aud-dashboard
spec:
  selector:
    app.kubernetes.io/name: aud-dashboard
  ports:
    - { name: http, port: 80, targetPort: http }          # 80 is on the cluster's Service port allowlist
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aud-dashboard
  annotations:
    azure.workload.identity/client-id: "<uami-client-id>"
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aud-dashboard
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aud-dashboard
