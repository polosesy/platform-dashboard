# HTTPS in front of the dashboard on an on-prem host (compose profile `tls`). TLS ends here with an internal
# certificate; the web listens on the shared `pod` namespace (:3000). Timeouts follow the web's /api proxy (120 s):
# a live diagram for a large subscription reads the whole topology first. Buffering off: sample diagrams stream (SSE).
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://pod:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
