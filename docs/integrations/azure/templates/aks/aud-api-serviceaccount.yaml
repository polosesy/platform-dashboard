# PLATFORM side (the cluster the dashboard API runs in) — the service account whose token customers' apps trust.
# Any Kubernetes with a public OIDC issuer works (AKS: --enable-oidc-issuer). No Azure identity is bound here: the
# token is exchanged at each customer's own app (federated credential: issuer = this cluster's issuer, subject =
# system:serviceaccount:aud:aud-api). The API reads the file named by AUD_FEDERATED_TOKEN_FILE on every request
# (the kubelet rotates it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aud-api
  namespace: aud
automountServiceAccountToken: false
---
# Excerpt of the API Deployment: the projected token with the Entra token-exchange audience
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aud-api
  namespace: aud
spec:
  template:
    spec:
      serviceAccountName: aud-api
      containers:
        - name: api
          env:
            - name: AUD_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/aud/tokens/azure-identity-token
            # Shown to admins to write customers' federated credentials (display only)
            - name: AUD_PLATFORM_OIDC_ISSUER
              value: "<THIS_CLUSTER_OIDC_ISSUER_URL>"
            - name: AUD_PLATFORM_FEDERATION_SUBJECT
              value: system:serviceaccount:aud:aud-api
          volumeMounts:
            - name: azure-identity-token
              mountPath: /var/run/secrets/aud/tokens
              readOnly: true
      volumes:
        - name: azure-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: azure-identity-token
