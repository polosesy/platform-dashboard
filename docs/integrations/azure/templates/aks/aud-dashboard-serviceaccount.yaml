# PLATFORM side (the cluster the dashboard runs in) — the service account whose token both identities trust.
# Canonical subject: system:serviceaccount:aud-dashboard:aud-dashboard (namespace aud-dashboard, SA aud-dashboard) —
# the Helm chart (deploy/helm/aud-dashboard) uses exactly this and prints it as AUD_PLATFORM_FEDERATION_SUBJECT.
# Every federated credential (the home platform identity's, each customer connection app's) must name:
#   issuer = this cluster's OIDC issuer · subject = the canonical subject · audience = api://AzureADTokenExchange
# A different namespace or name → AADSTS700213 → connection_federation_mismatch.
#
# AKS (workload identity webhook): the chart's ServiceAccount + pod label azure.workload.identity/use is all it
# takes — the webhook projects the token and sets AZURE_FEDERATED_TOKEN_FILE (the API reads it on every request).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aud-dashboard
  namespace: aud-dashboard
  annotations:
    azure.workload.identity/client-id: "<HOME_PLATFORM_IDENTITY_CLIENT_ID>"
    azure.workload.identity/tenant-id: "<HOME_TENANT_ID>"
automountServiceAccountToken: false
---
# Other Kubernetes (no webhook, public OIDC issuer): project the token yourself — excerpt of the api container
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aud-dashboard
  namespace: aud-dashboard
spec:
  template:
    spec:
      serviceAccountName: aud-dashboard
      containers:
        - name: api
          env:
            - name: AUD_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/aud/tokens/azure-identity-token
            # Shown to admins to write customers' federated credentials (display only)
            - name: AUD_PLATFORM_OIDC_ISSUER
              value: "<THIS_CLUSTER_OIDC_ISSUER_URL>"
            - name: AUD_PLATFORM_FEDERATION_SUBJECT
              value: system:serviceaccount:aud-dashboard:aud-dashboard
          volumeMounts:
            - name: azure-identity-token
              mountPath: /var/run/secrets/aud/tokens
              readOnly: true
      volumes:
        - name: azure-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: azure-identity-token
